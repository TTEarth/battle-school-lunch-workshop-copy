[project]
name = "lunch-battle-mcp"
version = "1.0.0"
description = "급식 배틀 MCP 서버 - NEIS 급식 조회 도구 제공 (Streamable HTTP)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0,<2",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
