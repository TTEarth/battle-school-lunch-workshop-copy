[project]
name = "lunch-battle-backend"
version = "1.0.0"
description = "급식 배틀 백엔드 - NEIS 중계 API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
